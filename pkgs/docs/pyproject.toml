[project]
name = "docs"
version = "0.1.0"
description = "Docs for py pkga."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cv-model",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocs-monorepo-plugin>=1.1.2",
    "pymdown-extensions>=10.16.1",
    "mkdocstrings-python>=1.16.12",
    "pygments>=2.19.2",
    "ruff>=0.12.12",
    "griffe-inherited-docstrings>=1.1.2",
]

[tool.uv.sources]
cv-model = { path = "../cv_model", editable = true }
