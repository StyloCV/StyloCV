site_name: Pkg docs
use_directory_urls: true

nav:
  - Home:
      - Home: index.md
  - cv_model:
      - Index: "!include ./cv_model/mkdocs.yml"

theme:
  name: material
  # logo: assets/logo.png
  # favicon: assets/logo.png
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer

    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true

    - content.code.copy

copyright: Copyright &copy; 2016 - 2026 StyloCV

plugins:
  - search
  - monorepo
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            [
              ../cv_model/src,
            ]
          options:
            show_root_heading: true
            show_root_full_path: false
            allow_inspection: true
            heading_level: 3
            members_order: source
            show_overloads: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            inherited_members: true
          extensions:
            - griffe_inherited_docstrings:
              merge: true

markdown_extensions:
  - toc:
      title: On this page
      permalink: ⚓︎
      toc_depth: 4
  - abbr
  #   - pymdownx.snippets:
  #       auto_append:
  #         - includes/abbreviations.md

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.blocks.caption
  - md_in_html
  - admonition
  - pymdownx.details
